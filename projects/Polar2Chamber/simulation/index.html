<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Polar2 Simulation</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

const HOUSING_H = 9;

const PIVOT_H = 14;

const NOZZLE_LEN = 5;

const PORT_COUNT = [3, 3, 0, 0];
const PORT_R = 12;
const PORT_H = 5;
const PORT_FLOOR = 2;
const PORT_RIM_R = 10;
const PORT_JET_H = 9;

const JET_R = 1;

const FIXED_ANGLE_DEG = [0, 90, 180, 270];
const FIXED_R = 72;
const FIXED_BODY = 2.6;
const FIXED_BODY_H = 5;
const FIXED_REACH = 7;
const FIXED_LAND_R = 6;

const EXHAUST_ANGLE_DEG = [0, 90, 180, 270];
const EXHAUST_FROM_R = 118;
const EXHAUST_TO_R = 144;
const EXHAUST_Z = 10;
const EXHAUST_PIPE_R = 7;
const EXHAUST_FLOW_LEN = 34;

const P = k.fitProjection(

const depth = ([x, y, z = 0]) => k.depthOf([x, y, z], P);

const rectRing = ([ax, ay], [bx, by], width) => {

const tubeSvg = (from, to, radius, extra = "") => {

const viewerAngle = VIEW.azimuth * RAD;
const viewVector = [Math.cos(viewerAngle) * Math.cos(VIEW.elevation * RAD), Math.sin(viewerAngle) * Math.cos(VIEW.elevation * RAD), Math.sin(VIEW.elevation * RAD)];
const lightOf = ([nx, ny]) => {
  const [lx, ly] = [-Math.sin(viewerAngle), Math.cos(viewerAngle)];
  return Math.min(k.SHADES - 1, Math.max(0, Math.floor(((nx * lx + ny * ly + 1) / 2) * k.SHADES)));

const pt = (r, z, abs = false) => ({ r, z, abs });
const seg = (a, b, n) => {
  const length = Math.hypot(n[0], n[1]);
  return { a, b, n: [n[0] / length, n[1] / length] };

function revolve(segments, zOf, edges, steps) {
  const half = (front) => {
    const count = steps / 2;
    const start = viewerAngle + (front ? -Math.PI / 2 : Math.PI / 2);
    const thetas = Array.from({ length: count + 1 }, (_, index) => start + (index / count) * Math.PI);
    const vertex = (p, theta) => {
      const [x, y] = polar(0, 0, p.r, theta);
      return [x, y, p.abs ? p.z : zOf(x) + p.z];
    };
    const faces = [];
    for (const s of segments) {
      for (let index = 0; index < count; index++) {
        const middle = (thetas[index] + thetas[index + 1]) / 2;
        const normal = [s.n[0] * Math.cos(middle), s.n[0] * Math.sin(middle), s.n[1]];
        if (normal[0] * viewVector[0] + normal[1] * viewVector[1] + normal[2] * viewVector[2] <= 0.02) continue;
        const quad = [vertex(s.a, thetas[index]), vertex(s.a, thetas[index + 1]), vertex(s.b, thetas[index + 1]), vertex(s.b, thetas[index])];
        const centre = quad.reduce((sum, point) => sum + depth(point), 0);
        const d = k.pathOf(quad.map(at), true);
        const svg = Math.abs(s.n[1]) > 0.5
          ? `<path class="iso-top" d="${d}"/>`
          : `<path class="iso-shade" data-shade="${lightOf(normal)}" d="${d}"/>`;
        faces.push([centre, svg, faces.length]);
      }
    }
    const body = faces.sort((a, b) => (Math.abs(a[0] - b[0]) > 1e-6 ? a[0] - b[0] : a[2] - b[2])).map(([, svg]) => svg).join("");
    const lines = edges
      .filter((edge) => front || edge.both)
      .map((edge) => L(k.pathOf(thetas.map((theta) => at(vertex(edge.p, theta)))), { tone: edge.tone }))
      .join("");
    return `<g class="iso-solid" data-seamless>${body}${lines}</g>`;
  };
  return { back: half(false), front: half(true) };
}

const slantHeight = (west, east, reach) => (x) => west + ((east - west) * (x + reach)) / (2 * reach);

function cupParts(index, west, east) {
  const outer = CUP_OUTER_R[index];
  const inner = outer - CUP_WALL;
  const tip = outer - CUP_LIP_REACH;
  const segments = [
    seg(pt(outer, 0, true), pt(outer, 0), [1, 0]),
    seg(pt(outer, 0), pt(tip, CUP_LIP_RISE), [CUP_LIP_RISE, CUP_LIP_REACH]),
    seg(pt(tip, CUP_LIP_RISE), pt(tip, CUP_LIP_RISE - CUP_LIP_T), [-1, 0]),
    seg(pt(inner, -CUP_LIP_T), pt(inner, 0, true), [-1, 0]),
  ];

    { p: pt(outer, 0), tone: "hi", both: true },
    { p: pt(tip, CUP_LIP_RISE), tone: "hi", both: true },
    { p: pt(tip, CUP_LIP_RISE - CUP_LIP_T), tone: "lo", both: false },
    { p: pt(outer, 0, true), tone: "lo", both: false },
  ];
  return revolve(segments, slantHeight(west, east, outer), edges, CUP_STEPS);
}

function outsideRingParts() {
  const segments = [
    seg(pt(RING.outer, RING.base, true), pt(RING.outer, RING.top, true), [1, 0]),
    seg(pt(RING.outer, RING.top, true), pt(RING.inner, RING.top, true), [0, 1]),
    seg(pt(RING.inner, RING.top, true), pt(RING.inner, RING.base, true), [-1, 0]),
  ];
  const edges = [
    { p: pt(RING.outer, RING.top, true), tone: "hi", both: true },
    { p: pt(RING.inner, RING.top, true), tone: "lo", both: true },
    { p: pt(RING.outer, RING.base, true), tone: "lo", both: false },

function ringTicksSvg(angle) {

function holderSvg(angle) {

    .map(([x, y]) => S(k.cylinder(x, y, PIN_R, CHUCK_TOP, PIN_TOP - CHUCK_TOP, P, 12), { tone: "mid", crease: "none" })

const armGeometry = (index) => {
  const [sx, sy] = CORNERS[index];
  const post = [sx * POST_OFFSET, sy * POST_OFFSET];
  return { post, length: Math.hypot(post[0], post[1]), toCenter: Math.atan2(-post[1], -post[0]) };
};

const boomAngle = (index, rotateDeg) => armGeometry(index).toCenter + rotateDeg * RAD;

const nozzlePoints = (index, rotateDeg) => {
  const { post, length } = armGeometry(index);
  const boom = boomAngle(index, rotateDeg);
  return Array.from({ length: NOZZLE_COUNT[index] }, (_, nozzle) => polar(post[0], post[1], length, boom + nozzle * NOZZLE_PITCH_DEG * RAD));

const headCentre = (points) => [points.reduce((sum, p) => sum + p[0], 0) / points.length, points.reduce((sum, p) => sum + p[1], 0) / points.length];

const spanOf = (points, index, rotateDeg, pad) => {
  const boom = boomAngle(index, rotateDeg);
  const tangent = [-Math.sin(boom), Math.cos(boom)];
  const last = points[points.length - 1];
  return [[points[0][0] - tangent[0] * pad, points[0][1] - tangent[1] * pad], [last[0] + tangent[0] * pad, last[1] + tangent[1] * pad]];

function armBodySvg(index, rotateDeg, liftZ) {
  const [px, py] = armGeometry(index).post;

  const [from, to] = spanOf(points, index, rotateDeg, HEAD_PAD);
  const headZ = liftZ - HEAD_BELOW;
  const out = [
    S(k.cylinder(px, py, SHAFT_R, PIVOT_H, liftZ + SHAFT_CAP - PIVOT_H, P, 20, 0.4), { tone: "hi", crease: "lo" }),
    tubeSvg([px, py, liftZ], [centreX, centreY, liftZ], BOOM_R),
  ];
  for (const [x, y] of byDepth(points)) out.push(S(k.cylinder(x, y, NOZZLE_R, headZ - NOZZLE_LEN, NOZZLE_LEN, P, 12), { tone: "hi", crease: "none" }));
  out.push(solidRing(rectRing(from, to, HEAD_W), headZ, HEAD_BELOW + HEAD_ABOVE, { tone: "hi", crease: "lo" }));

const portCentre = (index) => headCentre(nozzlePoints(index, ARM_ROTATE_DEG.NozzlePort));

const jetColumn = ([x, y], topZ, floorZ) => S(k.cylinder(x, y, JET_R, floorZ, topZ - floorZ, P, 10), { tone: "blue", crease: "none" });

function jetFloor(index, point) {
  if (Math.hypot(point[0], point[1]) <= WAFER_R) return WAFER_TOP;
  if (!PORT_COUNT[index]) return 0;
  const [cx, cy] = portCentre(index);
  return Math.hypot(point[0] - cx, point[1] - cy) <= PORT_RIM_R ? PORT_FLOOR : 0;

function armJetSvg(index, nozzle, rotateDeg, liftZ) {
  const point = nozzlePoints(index, rotateDeg)[nozzle];
  return jetColumn(point, liftZ - HEAD_BELOW - NOZZLE_LEN, jetFloor(index, point));

function fixedNozzleParts(index, cupWest, cupEast) {
  const angle = FIXED_ANGLE_DEG[index] * RAD;

  const [tx, ty] = polar(0, 0, FIXED_R - FIXED_REACH, angle);
  const bodyPlan = { x: x - FIXED_BODY, y: y - FIXED_BODY, w: FIXED_BODY * 2, d: FIXED_BODY * 2, r: 0.8 };

  const jet = `<path class="jet-line" d="${k.pathOf([at([tx, ty, tipZ]), at([lx, ly, WAFER_TOP])])}"/>`;

function targetList() {

  add("OutsideRing", "spin", ["CW", "CCW", "Stop"]);
  CUP_OUTER_R.forEach((_, index) => ["Master", "Slave"].forEach((side) => add(`Cup${index + 1}.${side}`, "cup", ["Top", "Middle", "Down", "Hold"], { index, side })));
  CORNERS.forEach((_, index) => {

    add(`Arm${index + 1}.Rotate`, "rotate", [...Object.keys(ARM_ROTATE_DEG), "Hold"], { index });
    for (let nozzle = 0; nozzle < NOZZLE_COUNT[index]; nozzle++) add(`Arm${index + 1}.Nozzle${nozzle + 1}`, "nozzle", ["On", "Off"], { index });
    for (let port = 0; port < PORT_COUNT[index]; port++) add(`Arm${index + 1}.Port${port + 1}`, "port", ["On", "Off"], { index });

  EXHAUST_ANGLE_DEG.forEach((_, index) => add(`ExhaustFan${index + 1}`, "exhaust", ["On", "Off"], { index }));

const block = (id, anchor, align, lines, offset = [0, 0]) => ({ id, anchor: at(anchor).map((v, i) => v + offset[i]), align, lines });
const single = (key, prefix) => ({ keys: [key], prefix });

function labelBlocks() {
  const armPost = (index) => [...armGeometry(index).post, ARM_Z.Top + SHAFT_CAP];
  const armAlign = ["start", "start", "start", "end"];
  const armLines = (index) => [
    single(`Arm${index + 1}.Lift`, "Lift"),
    single(`Arm${index + 1}.Rotate`, "Rot"),
    ...Array.from({ length: NOZZLE_COUNT[index] }, (_, n) => single(`Arm${index + 1}.Nozzle${n + 1}`, `N${n + 1}`)),
    ...Array.from({ length: PORT_COUNT[index] }, (_, n) => single(`Arm${index + 1}.Port${n + 1}`, `P${n + 1}`)),

    block("Holder", [-10, 100, 0], "end", [single("Holder", "Holder")]),

    ...CORNERS.map((_, i) => block(`Arm${i + 1}`, armPost(i), armAlign[i], armLines(i), [armAlign[i] === "end" ? -8 : 8, 0])),
    ...fixedSpot.map((spot, i) => block(`FixedNozzle${i + 1}`, spot, sideAlign[i], [single(`FixedNozzle${i + 1}`, `FN${i + 1}`)])),
    ...exhaustSpot.map((spot, i) => block(`ExhaustFan${i + 1}`, spot, sideAlign[i], [single(`ExhaustFan${i + 1}`, `Fan${i + 1}`)])),

const SVG_NS = "http://www.w3.org/2000/svg";
const byId = (id) => document.getElementById(id);
const statusEl = document.querySelector("[data-corner='hint']");
const errorsEl = byId("errors");
const labelsLayer = byId("Labels");
const targetByKey = new Map(TARGETS.map((entry) => [entry.key.toLowerCase(), entry]));

const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const tween = (value) => ({ from: value, to: value, start: 0, dur: 0 });
const settled = (t, now) => t.dur <= 0 || now - t.start >= t.dur;
function valueAt(t, now) {
  if (settled(t, now)) return t.to;
  return t.from + (t.to - t.from) * ease((now - t.start) / t.dur);
}

function freshState() {
  const spin = () => ({ dir: 0, angle: 0, since: 0 });
  return {
    cups: CUP_OUTER_R.map((_, index) => ({ Master: tween(CUP_RIM[CUP_INITIAL][index]), Slave: tween(CUP_RIM[CUP_INITIAL][index]) })),
    lift: CORNERS.map(() => tween(ARM_Z[ARM_LIFT_INITIAL])),
    rotate: CORNERS.map(() => tween(ARM_ROTATE_DEG[ARM_ROTATE_INITIAL])),
    spin: { Holder: spin(), OutsideRing: spin() },
    active: {},
    labels: {},
  };
}
let state = freshState();

const spinAngle = (s, now) => s.angle + (s.dir * SPIN_DEG_PER_S * (Math.PI / 180) * (now - s.since)) / 1000;

function moveTo(t, goal, durationMs, now) {
  const current = valueAt(t, now);
  const duration = durationMs === null || durationMs === undefined ? TWEEN_DEFAULT_MS : Number(durationMs);
  if (goal === null) {
    Object.assign(t, { from: current, to: current, start: now, dur: 0 });
    return;
  }
  if (!(duration > 0)) {
    Object.assign(t, { from: goal, to: goal, start: now, dur: 0 });
    return;
  }
  Object.assign(t, { from: current, to: goal, start: now, dur: duration });
}

const goalOf = (table, action, index) => (action === "Hold" ? null : (index === undefined ? table[action] : table[action][index]));

const HANDLERS = {
  spin(entry, action, now) {
    const s = state.spin[entry.key];
    s.angle = spinAngle(s, now) % (Math.PI * 2);
    s.since = now;
    s.dir = action === "CW" ? 1 : action === "CCW" ? -1 : 0;
  },
  cup(entry, action, now, command) {
    moveTo(state.cups[entry.index][entry.side], goalOf(CUP_RIM, action, entry.index), command.durationMs, now);
  },
  lift(entry, action, now, command) {
    moveTo(state.lift[entry.index], goalOf(ARM_Z, action), command.durationMs, now);
  },
  rotate(entry, action, now, command) {
    moveTo(state.rotate[entry.index], goalOf(ARM_ROTATE_DEG, action), command.durationMs, now);
  },
  switch(entry, action) {
    state.active[entry.key] = action === "On";
  },
};
// A position keeps its last label when a command has no value (the leave Hold); a spin or switch shows nothing once it stops.
const POSITION_TYPES = new Set(["cup", "lift", "rotate"]);
const handlerOf = (type) => HANDLERS[type] ?? HANDLERS.switch;

function formatLabel(value, unit) {
  if (value === null || value === undefined) return null;
  const number = Number(value);
  return (Number.isFinite(number) ? number.toFixed(1) : String(value)) + " " + unit;
}

const errorLines = [];
function reportUnknown(command) {
  errorLines.push("未知指令：" + command.target + " " + command.action);
  if (errorLines.length > ERROR_LINES) errorLines.splice(0, errorLines.length - ERROR_LINES);
  errorsEl.textContent = errorLines.join("\n");
}

function apply(command, now) {
  const entry = command ? targetByKey.get(String(command.target).toLowerCase()) : undefined;
  const action = entry?.actions.find((name) => name.toLowerCase() === String(command.action).toLowerCase());
  if (!action) {
    reportUnknown(command ?? { target: "", action: "" });
    return;
  }
  handlerOf(entry.type)(entry, action, now, command);
  const label = formatLabel(command.value, entry.unit);
  if (label === null && POSITION_TYPES.has(entry.type)) return;
  state.labels[entry.key] = label;
}

const labelBlockNodes = labelBlocks().map((spec) => {
  const lines = spec.lines.map((line) => {
    const text = document.createElementNS(SVG_NS, "text");
    text.setAttribute("class", "part-label");
    text.setAttribute("text-anchor", spec.align);
    const key = document.createElementNS(SVG_NS, "tspan");
    key.setAttribute("class", "lbl-key");
    key.textContent = line.prefix + " ";
    const value = document.createElementNS(SVG_NS, "tspan");
    text.append(key, value);
    text.style.display = "none";
    labelsLayer.appendChild(text);
    return { line, text, value };
  });
  return { spec, lines };
});

function drawLabels() {
  for (const { spec, lines } of labelBlockNodes) {
    let row = 0;
    for (const { line, text, value } of lines) {
      const label = line.keys.map((key) => state.labels[key]).find((entry) => entry);
      text.style.display = label ? "" : "none";
      if (!label) continue;
      value.textContent = label;
      text.setAttribute("x", spec.anchor[0].toFixed(1));
      text.setAttribute("y", (spec.anchor[1] + row * LABEL_LINE_PX).toFixed(1));
      row++;
    }
  }
}

const drawn = new Map();
function update(id, key, make) {
  if (drawn.get(id) === key) return;
  drawn.set(id, key);
  byId(id).innerHTML = make();
}
const show = (id, on) => { byId(id).style.display = on ? "" : "none"; };

function drawCups(now) {
  const rims = state.cups.map((cup) => [valueAt(cup.Slave, now), valueAt(cup.Master, now)]);
  rims.forEach(([west, east], index) => {
    const key = `${west},${east}`;
    const id = "Cup" + (index + 1);
    if (drawn.get(id) === key) return;
    drawn.set(id, key);
    const parts = cupParts(index, west, east);
    byId(id + "-back").innerHTML = parts.back;
    byId(id + "-front").innerHTML = parts.front;
  });
  return rims[3];
}

function drawFixed(rim) {
  FIXED_ANGLE_DEG.forEach((_, index) => {
    const id = "FixedNozzle" + (index + 1);
    update(id + "-base", `${rim[0]},${rim[1]}`, () => fixedNozzleParts(index, rim[0], rim[1]).base);
    show(id + "-jet", state.active[id]);
    if (state.active[id]) update(id + "-jet", `${rim[0]},${rim[1]}`, () => fixedNozzleParts(index, rim[0], rim[1]).jet);
  });
}

function drawArms(now) {
  CORNERS.forEach((_, index) => {
    const rotate = valueAt(state.rotate[index], now);
    const lift = valueAt(state.lift[index], now);
    const key = `${rotate},${lift}`;
    const id = "Arm" + (index + 1);
    update(id, key, () => armBodySvg(index, rotate, lift));
    for (let nozzle = 0; nozzle < NOZZLE_COUNT[index]; nozzle++) {
      const jet = id + "-Nozzle" + (nozzle + 1) + "-jet";
      const on = state.active[id + ".Nozzle" + (nozzle + 1)];
      show(jet, on);
      if (on) update(jet, key, () => armJetSvg(index, nozzle, rotate, lift));
    }
    for (let port = 0; port < PORT_COUNT[index]; port++) show(id + "-Port" + (port + 1) + "-jet", state.active[id + ".Port" + (port + 1)]);
  });
}

function draw(now) {
  const holder = spinAngle(state.spin.Holder, now);
  const ring = spinAngle(state.spin.OutsideRing, now);
  update("Holder", String(holder % (Math.PI * 2)), () => holderSvg(holder));
  update("OutsideRing-ticks", String(ring % (Math.PI * 2)), () => ringTicksSvg(ring));
  drawFixed(drawCups(now));
  drawArms(now);
  EXHAUST_ANGLE_DEG.forEach((_, index) => show("ExhaustFan" + (index + 1) + "-flow", state.active["ExhaustFan" + (index + 1)]));
  drawLabels();
}

function busy(now) {
  const moving = [...state.lift, ...state.rotate, ...state.cups.flatMap((cup) => [cup.Master, cup.Slave])].some((t) => !settled(t, now));
  return moving || state.spin.Holder.dir !== 0 || state.spin.OutsideRing.dir !== 0;
}

let frame = 0;
const visible = () => document.visibilityState === "visible";
function refresh() {
  if (!visible()) return;
  const now = performance.now();
  draw(now);
  if (busy(now) && !frame) frame = requestAnimationFrame(tick);
}
function tick() {
  frame = 0;
  refresh();
}
document.addEventListener("visibilitychange", refresh);

const setStatus = (text) => { statusEl.textContent = text; };

function onMessage(data) {
  if (typeof data !== "object" || data === null) return;
  const now = performance.now();
  if (data.type === "project") {
    state = freshState();
    drawn.clear();
    setStatus(data.running ? String(data.name ?? "") : "Polar2 未執行");
  }
  if (data.type === "simState") (Array.isArray(data.commands) ? data.commands : []).forEach((command) => apply({ ...command, durationMs: 0 }, now));
  if (data.type === "sim") apply(data.command, now);
  refresh();
}

function connect(delay = 500) {
  if (location.protocol === "file:") {
    setStatus("靜態預覽（未連線）");
    return;
  }
  const socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/live");
  socket.addEventListener("open", () => {
    delay = 500;
    setStatus("已連線");
  });
  socket.addEventListener("message", (message) => {
    let data;
    try {
      data = JSON.parse(message.data);
    } catch {
      return;
    }
    onMessage(data);
  });
  socket.addEventListener("close", () => {
    setStatus("離線，重新連線中");
    setTimeout(() => connect(Math.min(delay * 2, 8000)), delay);
  });
}

connect();
</script></body></html>
